<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Threat Detector{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">URL Threat Detector</a>
    <nav>
      <a href="{{ url_for('index') }}">Scan</a>
      <a href="{{ url_for('history_page') }}">History</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Results are heuristic and not a guarantee of safety. We never visit the URL you submit.</p>
  </footer>

  <script src="{{ url_for('static', filename='css/app.js') }}" defer></script>
</body>
</html>
